name: CI

on:
  push:
    branches: [master, dev, experimental]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests du codec (chiffrement + stéganographie)
        run: npm test
